# Utökat log-format: combined PLUS request-tid och POST/PUT-body.
# $request_body fångar payloaden i POST/PUT-requests — t.ex. SQLi i
# email-fältet vid login. Standardformatet "combined" loggar BARA
# request-line (metod + URL), inte body, så POST-attacker blir osynliga.
#
# VIKTIGT: Wazuhs web-accesslog-decoder förväntar sig EXAKT combined-
# format. Lägger man till fält i slutet bryts dess regex och ALL
# web-detection slutar fungera. Därför skriver vi TVÅ loggar:
#   - access.log          = ren combined  -> Wazuh fortsätter parsa
#   - access_detailed.log = utökat format -> innehåller POST-body
log_format utokad '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time body="$request_body"';

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/access_detailed.log utokad;
    error_log /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://offer-juice-shop:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
